name: Lesson 2

on:
  push:
    branches:
      - lesson-2
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/hangry_api/settings.py
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment

 
  unit_test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Set up Python for the unit tests
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Install the packages required for testing
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest django-mock-queries six coverage
        working-directory: backend

      # Run the tests and display code coverage
      - name: Run unit tests
        run: |
          python -m coverage run --source=./hangry_api -m pytest
          python -m coverage report -m
        working-directory: backend
